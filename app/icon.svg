<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150B28" />
      <stop offset="100%" stop-color="#06020E" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE8F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container with subtle violet rim -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Monogram AP -->
  <g font-family="'Libre Baskerville', Georgia, serif" font-weight="700" font-size="54" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="central">
    <text x="54" y="64" letter-spacing="-2">AP</text>
  </g>

  <!-- Subtle glowing violet accent dot -->
  <circle cx="89" cy="74" r="4.5" fill="#A78BFA" filter="url(#glow)" />
  <circle cx="89" cy="74" r="3" fill="#EDE8F6" />
</svg>
